[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msadpcm"
version = "0.1.3"
description = "Microsoft ADPCM (WAVE_FORMAT_ADPCM) encoder and decoder in pure Python + NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Y-Dr. Now" }]
keywords = ["adpcm", "ms-adpcm", "microsoft-adpcm", "wav", "audio", "codec", "encoder", "decoder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
msadpcm = "msadpcm.cli:main"

[project.urls]
Homepage = "https://github.com/Eyef/msadpcm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
